# --------------------------------------------------
# site metadata
# --------------------------------------------------
site_name: cfd-ops
site_url: https://uahypersonics.github.io/cfd-ops
site_author: Christoph Hader
site_description: Operations for transforming, extracting, remapping, and combining CFD datasets.

# --------------------------------------------------
# github repository (adds link in top right corner)
# --------------------------------------------------
repo_name: uahypersonics/cfd-ops
repo_url: https://github.com/uahypersonics/cfd-ops
edit_uri: edit/main/docs/

# --------------------------------------------------
# theme configuration
# --------------------------------------------------
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue grey
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: blue grey
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view

# --------------------------------------------------
# plugins
# --------------------------------------------------
plugins:
  - search

# --------------------------------------------------
# markdown extensions
# --------------------------------------------------
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html

# --------------------------------------------------
# navigation
# --------------------------------------------------
nav:
  - Home: index.md
  - Installation: installation.md
  - User Guide:
    - Overview: user_guide/index.md
    - Workflow: user_guide/workflow.md
    - Configuration: user_guide/configuration.md
  - Theory:
    - theory/index.md
  - CLI Reference:
    - cli_reference/index.md
  - API Reference:
    - api/index.md
  - Validation and Verification:
    - vnv/index.md
    - Verification: vnv/verification/index.md
    - Validation: vnv/validation/index.md
  - Examples: examples.md
  - Nomenclature: nomenclature.md
